<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Temporarily Down</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      text-align: center;
    }
    .card {
      max-width: 520px;
      margin: 20px;
      padding: 45px 30px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }
    .icon { font-size: 58px; margin-bottom: 15px; }
    h1 { margin: 0 0 15px; font-size: 30px; }
    p { margin: 8px 0; color: #6b7280; font-size: 16px; line-height: 1.6; }
    .status {
      display: inline-block;
      margin-top: 20px;
      padding: 9px 16px;
      border-radius: 999px;
      background: #fff1f2;
      color: #be123c;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>Server Temporarily Down</h1>
    <p>Our server is currently unavailable.</p>
    <p>We're working to restore the service as soon as possible.</p>
    <div class="status">Please try again later</div>
  </div>
</body>
</html>
